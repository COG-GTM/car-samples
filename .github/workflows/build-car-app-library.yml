name: Build Car App Library samples

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'car_app_library/**'
      - '.github/workflows/build-car-app-library.yml'
  pull_request:
    paths:
      - 'car_app_library/**'
      - '.github/workflows/build-car-app-library.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: car_app_library
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble and lint
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g
        run: ./gradlew assembleDebug lint
