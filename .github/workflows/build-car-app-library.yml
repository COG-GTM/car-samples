# Workflow name
name: Build Car App Library Samples

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: ./car_app_library

      - name: Build Car App Library samples
        working-directory: ./car_app_library
        run: ./gradlew :showcase:mobile:assembleDebug :showcase:automotive:assembleDebug :navigation:mobile:assembleDebug :navigation:automotive:assembleDebug testDebugUnitTest
